name: CI

# push 到 main、trae/agent-* 或 PR 时触发：构建 universal debug + 跑单元测试。
# 同时上传 universal-debug APK 作为 artifact，便于非 main 分支快速下载试用。
# 打 v* tag 的发版构建走 android-release.yml，不在这里。
on:
  push:
    branches: [ main, 'trae/agent-*' ]
    # 纯文档/资源改动不影响构建产物，跳过 CI 省时间（public 仓库虽不扣额度，但省 11 分钟等待）。
    # 注意：只要本次 push 含任一非忽略路径的改动，CI 仍会触发。
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'docs-site/**'
      - 'LICENSE'
      - '.gitignore'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'docs-site/**'
      - 'LICENSE'
      - '.gitignore'

# 同分支新提交到来时取消正在跑的旧 run，省 CI 额度。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # versionCode 由 build.gradle.kts 的 gitCommitCount() 在配置阶段取
          # git rev-list --count HEAD，浅克隆（默认 depth=1）会得到 1，必须拉完整历史。
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # PR 和 trae 分支用只读缓存，仅 main 的 push 写回缓存，避免被污染。
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      # 迁移版本号对账：编号连续、SCHEMA_VERSION 一致、已发布迁移未被篡改/复用
      # （hotfix 合流后 main 未把未发布迁移后移会在这里被拦）。
      - name: Check migration versions
        if: github.ref == 'refs/heads/main'
        run: python3 scripts/check_migrations.py

      # 单 flavor 冒烟：只构 universal debug（单 flavor 省三倍 Kotlin 编译），
      # universal debug 的 applicationId 是 com.aicode.debug，与正式版不冲突，可同机安装。
      - name: Build universal debug (smoke)
        run: ./gradlew :app:assembleUniversalDebug --stacktrace

      # 单测只在 main 跑，非 main 分支省时间出 APK。
      - name: Run unit tests
        if: github.ref == 'refs/heads/main'
        run: ./gradlew :app:testUniversalDebugUnitTest

      # 上传 universal-debug APK 作为 artifact，所有分支都传（非 main 分支用来下载试用）。
      - name: Upload universal-debug APK
        uses: actions/upload-artifact@v4
        with:
          name: aicode-universal-debug
          path: app/build/outputs/apk/universal/debug/*.apk
          if-no-files-found: error
          retention-days: 7
